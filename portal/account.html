<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Account - Homeless Aid UK</title>
<link rel="manifest" href="/portal/manifest.json">
<meta name="theme-color" content="#1A2332">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/portal/registration.css">
<style>
  .grid2 { display: grid; gap: 12px; } @media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1fr; align-items: start; } }
  .links { display: grid; gap: 8px; }
  .links a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; text-decoration: none; }
  .links a i:first-child { width: 20px; text-align: center; color: var(--navy); } .links a .chev { margin-left: auto; color: #A0AEC0; }
  .rules { list-style: none; padding: 0; margin: 0 0 12px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .rules li.ok { color: var(--ok); }
</style>
</head>
<body>
<div class="app">
  <div id="shellNav"></div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header class="topbar"><h1>Account</h1><p>Your login details and settings</p></header>
    <main class="main">
      <div class="card" style="display:flex;gap:16px;align-items:center">
        <span class="avatar lg" id="avatar"></span>
        <div><b style="font-size:17px" id="name"></b><br><span class="muted small" id="meta"></span></div>
      </div>
      <div class="links" style="margin-bottom:12px" id="links"></div>
      <div class="grid2">
        <form class="card" id="profileForm" novalidate>
          <h2>Profile</h2>
          <label class="field"><span>Full name</span><input class="input" name="full_name" required minlength="2" maxlength="100"></label>
          <label class="field"><span>Email</span><input class="input" type="email" name="email" required autocomplete="email"></label>
          <p class="small muted">Your full name is the name you type when signing the policies.</p>
          <button class="btn block" type="submit">Save profile</button>
        </form>
        <form class="card" id="passwordForm" novalidate>
          <h2>Change password</h2>
          <label class="field"><span>Current password</span><input class="input" type="password" name="currentPassword" autocomplete="current-password" required></label>
          <label class="field"><span>New password</span><input class="input" type="password" name="newPassword" autocomplete="new-password" required></label>
          <ul class="rules"><li data-rule="len">6+ characters</li><li data-rule="letter">A letter</li><li data-rule="num">A number</li></ul>
          <label class="field"><span>Confirm new password</span><input class="input" type="password" name="confirm" autocomplete="new-password" required></label>
          <button class="btn block" type="submit">Update password</button>
        </form>
      </div>
      <div class="card" style="text-align:center"><button class="btn ghost" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Log out</button></div>
    </main>
  </div>
</div>
<script src="/portal/registration-shell.js"></script>
<script>
const me = Shell.requireAuth();
Shell.renderNav({ active: 'account', user: me });
const $ = (s) => document.querySelector(s);
const profile = $('#profileForm'), pw = $('#passwordForm');

$('#links').innerHTML = Shell.navItems(me).filter(i => i.key !== 'account').map(i => `<a href="${i.href}"><i class="fas ${i.icon}"></i>${i.label}<i class="fas fa-chevron-right chev"></i></a>`).join('');

async function load() {
    try {
        const m = await Shell.api('me');
        $('#avatar').textContent = Shell.initials(m.user.full_name);
        $('#name').textContent = m.user.full_name;
        $('#meta').textContent = `${m.user.username} · ${Shell.roleLabel(m.user.role)} · Volunteer #${String(m.user.volunteer_number || 0).padStart(4, '0')}${m.user.team ? ' · ' + m.user.team : ''}`;
        profile.full_name.value = m.user.full_name || ''; profile.email.value = m.user.email || '';
        if (m.user.has_photo) { try { const res = await fetch(Shell.apiUrl('photo', { id: me.id }), { headers: { Authorization: `Bearer ${Shell.getToken()}` } }); if (res.ok) $('#avatar').innerHTML = `<img src="${URL.createObjectURL(await res.blob())}" style="width:100%;height:100%;object-fit:cover">`; } catch {} }
    } catch (e) { Shell.toast(e.message, 'error'); }
}

profile.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = profile.querySelector('button'); btn.disabled = true;
    try {
        const r = await Shell.call('/api/auth/update-profile', { method: 'PUT', body: { full_name: profile.full_name.value.trim(), email: profile.email.value.trim() } });
        if (r.token && r.user) Shell.storeSession(r.token, r.user);
        Shell.toast('Profile saved'); load();
    } catch (ex) { Shell.toast(ex.message, 'error'); } finally { btn.disabled = false; }
});

const checks = { len: p => p.length >= 6, letter: p => /[A-Za-z]/.test(p), num: p => /[0-9]/.test(p) };
pw.newPassword.addEventListener('input', () => { for (const [k, fn] of Object.entries(checks)) pw.querySelector(`[data-rule="${k}"]`).classList.toggle('ok', fn(pw.newPassword.value)); });
pw.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!Object.values(checks).every(fn => fn(pw.newPassword.value))) return Shell.toast('The new password does not meet the rules', 'error');
    if (pw.newPassword.value !== pw.confirm.value) return Shell.toast('The new passwords do not match', 'error');
    const btn = pw.querySelector('button'); btn.disabled = true;
    try {
        await Shell.call('/api/auth/change-password', { method: 'POST', body: { currentPassword: pw.currentPassword.value, newPassword: pw.newPassword.value } });
        Shell.toast('Password updated'); pw.reset(); pw.querySelectorAll('[data-rule]').forEach(li => li.classList.remove('ok'));
    } catch (ex) { Shell.toast(ex.message, 'error'); } finally { btn.disabled = false; }
});
$('#logoutBtn').onclick = () => Shell.logout();
load();
</script>
</body>
</html>
