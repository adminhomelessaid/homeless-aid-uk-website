<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Users - Homeless Aid UK</title>
<link rel="manifest" href="/portal/manifest.json">
<meta name="theme-color" content="#1A2332">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/portal/registration.css">
</head>
<body>
<div class="app">
  <div id="shellNav"></div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header class="topbar" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div><h1>Users</h1><p id="subtitle">Portal accounts and roles</p></div>
      <button class="btn sm" id="inviteBtn"><i class="fas fa-user-plus"></i> Invite user</button>
    </header>
    <main class="main">
      <div class="kpis">
        <div class="kpi" data-role=""><div class="l">All users</div><div class="v" id="kAll">–</div></div>
        <div class="kpi" data-role="admin"><div class="l">Admins</div><div class="v" id="kAdmin">–</div></div>
        <div class="kpi" data-role="team_lead"><div class="l">Team leads</div><div class="v" id="kLead">–</div></div>
        <div class="kpi" data-role="volunteer"><div class="l">Volunteers</div><div class="v" id="kVol">–</div></div>
      </div>
      <input class="input" id="q" placeholder="Search name, username or email…" style="margin-bottom:10px">
      <div class="chips" style="margin-bottom:12px"><span class="chip on" data-f="">All</span><span class="chip" data-f="pending">Awaiting password</span><span class="chip" data-f="inactive">Inactive</span></div>
      <div id="cards"></div>
      <table class="table"><thead><tr><th>User</th><th>Username</th><th>Role</th><th>Status</th><th>Last login</th><th></th></tr></thead><tbody id="tbody"></tbody></table>
      <div class="empty hidden" id="empty">No users match.</div>
    </main>
  </div>
</div>
<div class="modal-bg" id="modal"><div class="modal" id="modalBody"></div></div>
<script src="/portal/registration-shell.js"></script>
<script>
const me = Shell.requireAuth();
if (me.role !== 'admin') location.href = Shell.landing(me);
Shell.renderNav({ active: 'users', user: me });
const $ = (s) => document.querySelector(s);
let users = [], roleFilter = '', stateFilter = '';
const ROLES = ['volunteer', 'team_lead', 'admin'];

function statusOf(u) {
    if (!u.is_active) return '<span class="st bad">Inactive</span>';
    if (!u.password_hash) return '<span class="st warn">Awaiting password</span>';
    return '<span class="st ok">Active</span>';
}

async function load() {
    try {
        const r = await Shell.call('/api/admin/list-users');
        users = r.users || [];
        $('#kAll').textContent = users.length; $('#kAdmin').textContent = users.filter(u => u.role === 'admin').length;
        $('#kLead').textContent = users.filter(u => u.role === 'team_lead').length; $('#kVol').textContent = users.filter(u => u.role === 'volunteer').length;
        render();
    } catch (e) { $('#cards').innerHTML = `<div class="empty">${Shell.escape(e.message)}</div>`; }
}

function render() {
    const q = $('#q').value.trim().toLowerCase();
    const rows = users.filter(u => (!roleFilter || u.role === roleFilter) && (stateFilter !== 'pending' || (!u.password_hash && u.is_active)) && (stateFilter !== 'inactive' || !u.is_active) && (!q || `${u.full_name} ${u.username} ${u.email}`.toLowerCase().includes(q)))
        .sort((a, b) => String(a.full_name).localeCompare(String(b.full_name)));
    $('#subtitle').textContent = `${rows.length} of ${users.length} accounts`;
    $('#empty').classList.toggle('hidden', rows.length > 0);
    const person = (u) => `<div class="person"><span class="avatar">${Shell.escape(Shell.initials(u.full_name))}</span><div><b>${Shell.escape(u.full_name)}</b><small>${Shell.escape(u.email)}</small></div></div>`;
    $('#tbody').innerHTML = rows.map(u => `<tr data-id="${u.id}" style="${u.is_active ? '' : 'opacity:.55'}"><td>${person(u)}</td><td>${Shell.escape(u.username)}</td><td>${Shell.roleLabel(u.role)}</td><td>${statusOf(u)}</td><td>${u.last_login ? Shell.fmtDate(u.last_login) : 'Never'}</td><td class="small muted">Edit ›</td></tr>`).join('');
    $('#cards').innerHTML = rows.map(u => `<a class="row-card" href="#" data-id="${u.id}" style="${u.is_active ? '' : 'opacity:.55'}"><span class="avatar">${Shell.escape(Shell.initials(u.full_name))}</span><div style="min-width:0"><b>${Shell.escape(u.full_name)}</b><small>${Shell.escape(u.username)} · ${Shell.roleLabel(u.role)}</small></div><div class="r">${statusOf(u)}</div></a>`).join('');
    document.querySelectorAll('[data-id]').forEach(el => el.addEventListener('click', (e) => { e.preventDefault(); openEdit(users.find(u => u.id === el.dataset.id)); }));
    document.querySelectorAll('.kpi').forEach(k => k.classList.toggle('on', k.dataset.role === roleFilter));
}

$('#q').addEventListener('input', render);
document.querySelectorAll('.kpi').forEach(k => k.onclick = () => { roleFilter = k.dataset.role; render(); });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => { stateFilter = c.dataset.f; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); render(); });

function openModal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
const roleOptions = (sel) => ROLES.map(r => `<option value="${r}" ${sel === r ? 'selected' : ''}>${Shell.roleLabel(r)}</option>`).join('');

$('#inviteBtn').onclick = () => {
    openModal(`<form id="inviteForm"><h2>Invite a user</h2><p class="small muted">They get an email with a link to set their password. Usernames are stored in lowercase.</p>
      <label class="field"><span>Full name</span><input class="input" name="full_name" required autofocus></label>
      <label class="field"><span>Email</span><input class="input" type="email" name="email" required></label>
      <label class="field"><span>Username</span><input class="input" name="username" required pattern="[a-zA-Z0-9_-]{3,50}" autocapitalize="none"></label>
      <label class="field"><span>Role</span><select class="select" name="role">${roleOptions('volunteer')}</select></label>
      <div class="actions"><button class="btn" type="submit">Send invitation</button><button class="btn ghost" type="button" id="cancelBtn">Cancel</button></div></form>`);
    $('#cancelBtn').onclick = closeModal;
    $('#inviteForm').onsubmit = async (e) => {
        e.preventDefault(); const f = e.target; const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
        try {
            await Shell.call('/api/admin/create-user', { method: 'POST', body: { full_name: f.full_name.value.trim(), email: f.email.value.trim(), username: f.username.value.trim(), role: f.role.value } });
            closeModal(); Shell.toast('Invitation sent'); load();
        } catch (ex) { Shell.toast(ex.message, 'error'); btn.disabled = false; }
    };
};

function openEdit(u) {
    const self = u.id === me.id;
    openModal(`<form id="editForm"><h2>${Shell.escape(u.full_name)}</h2><p class="small muted">${Shell.escape(u.username)} · joined ${Shell.fmtDate(u.created_at)}${u.last_login ? ' · last login ' + Shell.fmtDate(u.last_login) : ''}</p>
      <label class="field"><span>Full name</span><input class="input" name="full_name" value="${Shell.escape(u.full_name)}" required></label>
      <label class="field"><span>Email</span><input class="input" type="email" name="email" value="${Shell.escape(u.email)}" required></label>
      <label class="field"><span>Role</span><select class="select" name="role" ${self ? 'disabled' : ''}>${roleOptions(u.role)}</select>${self ? '<span class="small muted" style="font-weight:400">You cannot change your own role.</span>' : ''}</label>
      <div class="actions"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" id="cancelBtn">Cancel</button>${self ? '' : `<button class="btn ghost" type="button" id="setPwBtn" title="Type a new password for them"><i class="fas fa-key"></i> Set password</button><button class="btn ghost" type="button" id="resetBtn" title="Clears their password and emails a link to set a new one"><i class="fas fa-envelope"></i> Email reset link</button><button class="btn ${u.is_active ? 'danger' : ''}" type="button" id="toggleBtn" style="margin-left:auto">${u.is_active ? 'Block login' : 'Unblock'}</button>`}</div>
      <p class="small muted" style="margin:12px 0 0">Registration details, photo and signatures are on the <a href="/portal/volunteers#volunteer/${u.id}">volunteer record</a>.</p></form>`);
    $('#cancelBtn').onclick = closeModal;
    $('#editForm').onsubmit = async (e) => {
        e.preventDefault(); const f = e.target; const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
        try {
            await Shell.call('/api/admin/update-user', { method: 'PUT', body: { userId: u.id, full_name: f.full_name.value.trim(), email: f.email.value.trim(), role: self ? u.role : f.role.value } });
            closeModal(); Shell.toast('Saved'); load();
        } catch (ex) { Shell.toast(ex.message, 'error'); btn.disabled = false; }
    };
    const sp = $('#setPwBtn'); if (sp) sp.onclick = () => {
        openModal(`<form id="setPwForm"><h2>Set a password for ${Shell.escape(u.full_name)}</h2>
          <p class="small muted">Their current password stops working straight away. Tell them the new one in person or by phone, and suggest they change it on their Account page.</p>
          <label class="field"><span>New password</span><input class="input" name="password" autocomplete="off" autocapitalize="none" required placeholder="6+ characters with a letter and a number"></label>
          <div class="actions"><button class="btn" type="submit">Set password</button><button class="btn ghost" type="button" id="cancelSetPw">Cancel</button></div></form>`);
        $('#cancelSetPw').onclick = () => openEdit(u);
        $('#setPwForm').onsubmit = async (e) => {
            e.preventDefault(); const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
            try { await Shell.api('set-password', { method: 'POST', body: { user_id: u.id, password: e.target.password.value } }); closeModal(); Shell.toast(`Password set for ${u.full_name}`); load(); }
            catch (ex) { Shell.toast(ex.message, 'error'); btn.disabled = false; }
        };
    };
    const rb = $('#resetBtn'); if (rb) rb.onclick = async () => {
        if (!window.confirm(`Send ${u.full_name} a password reset link? Their current password stops working immediately.`)) return;
        rb.disabled = true;
        try {
            const r = await Shell.api('send-reset-link', { method: 'POST', body: { user_id: u.id } });
            if (r.emailed) { Shell.toast('Reset link emailed'); closeModal(); }
            else openModal(`<h2>Email could not be sent</h2><p class="small">Send them this link another way. It works for 7 days.</p><input class="input" readonly value="${Shell.escape(r.setup_url)}" onclick="this.select()"><div class="actions" style="margin-top:12px"><button class="btn ghost" type="button" id="closeReset">Close</button></div>`), ($('#closeReset').onclick = closeModal);
            load();
        } catch (ex) { Shell.toast(ex.message, 'error'); rb.disabled = false; }
    };
    const t = $('#toggleBtn'); if (t) t.onclick = async () => {
        try { await Shell.api(u.is_active ? 'block' : 'unblock', { method: 'POST', body: { user_id: u.id } }); closeModal(); Shell.toast(u.is_active ? 'Login blocked' : 'Unblocked'); load(); }
        catch (ex) { Shell.toast(ex.message, 'error'); }
    };
}
load();
</script>
</body>
</html>
