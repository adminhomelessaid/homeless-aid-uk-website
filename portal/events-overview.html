<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Attendances - Homeless Aid UK</title>
<link rel="manifest" href="/portal/manifest.json">
<meta name="theme-color" content="#1A2332">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/portal/registration.css">
<style>
  .filters { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-bottom: 12px; }
  @media (min-width: 900px) { .filters { grid-template-columns: 2fr 1fr 1fr 1fr auto; align-items: end; } }
  .filters .field { margin: 0; }
  .table th.sort { cursor: pointer; user-select: none; } .table th.sort.on { color: var(--navy); }
  .table th.sort.on::after { content: ' ↓'; } .table th.sort.on.asc::after { content: ' ↑'; }
  .num { text-align: right; font-weight: 700; }
  .table td.nw { white-space: nowrap; }
  .table td:last-child { max-width: 320px; }
  .row-card .n { font-size: 20px; font-weight: 800; min-width: 44px; text-align: center; }
  .sum { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 10px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <div id="shellNav"></div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header class="topbar" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div><h1>Attendances</h1><p id="subtitle">Every logged session</p></div>
      <div class="actions"><a class="btn sm" href="/portal/dashboard.html"><i class="fas fa-plus"></i> Log attendance</a><button class="btn ghost sm" id="csvBtn"><i class="fas fa-download"></i> CSV</button></div>
    </header>
    <main class="main">
      <div class="kpis">
        <div class="kpi"><div class="l">Entries shown</div><div class="v" id="kCount">–</div></div>
        <div class="kpi"><div class="l">People served (shown)</div><div class="v ok" id="kServed">–</div></div>
        <div class="kpi"><div class="l">Average per session</div><div class="v" id="kAvg">–</div></div>
        <div class="kpi"><div class="l">Busiest location</div><div class="v" id="kTop" style="font-size:16px;padding-top:6px">–</div></div>
      </div>
      <div class="filters">
        <label class="field"><span>Search</span><input class="input" id="q" placeholder="Event, location, volunteer or note"></label>
        <label class="field"><span>Location</span><select class="select" id="town"><option value="">All</option></select></label>
        <label class="field"><span>From</span><input class="input" type="date" id="from"></label>
        <label class="field"><span>To</span><input class="input" type="date" id="to"></label>
        <button class="btn ghost" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="sum"><span id="sumText"></span><span class="small">Tap a column heading to sort</span></div>
      <div id="cards"></div>
      <table class="table" id="table">
        <thead><tr>
          <th class="sort on" data-k="date">Date</th><th class="sort" data-k="day">Day</th><th class="sort" data-k="eventName">Event</th><th class="sort" data-k="town">Location</th><th class="sort num" data-k="peopleServed">Served</th><th class="sort" data-k="outreachName">Logged by</th><th>Notes</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty hidden" id="empty">No entries match.</div>
    </main>
  </div>
</div>
<script src="/portal/registration-shell.js"></script>
<script>
const me = Shell.requireAuth();
if (!Shell.isStaff(me)) { location.replace(Shell.landing(me)); throw new Error('redirecting'); }
Shell.renderNav({ active: 'attendances', user: me });
const $ = (s) => document.querySelector(s);
let all = [];
let sortKey = 'date', sortAsc = false;

async function load() {
    try {
        const r = await Shell.call('/api/attendance/index?limit=5000');
        all = (r.logs || []).map(l => ({ ...l, peopleServed: Number(l.peopleServed) || 0 }));
        $('#subtitle').textContent = `${all.length} logged sessions`;
        const towns = [...new Set(all.map(l => l.town).filter(Boolean))].sort();
        $('#town').innerHTML = '<option value="">All</option>' + towns.map(t => `<option>${Shell.escape(t)}</option>`).join('');
        render();
    } catch (e) { $('#cards').innerHTML = `<div class="empty">${Shell.escape(e.message)}</div>`; }
}

function filtered() {
    const q = $('#q').value.trim().toLowerCase(), town = $('#town').value, from = $('#from').value, to = $('#to').value;
    return all.filter(l => (!town || l.town === town) && (!from || l.date >= from) && (!to || l.date <= to) && (!q || `${l.eventName} ${l.town} ${l.outreachName} ${l.notes || ''}`.toLowerCase().includes(q)))
        .sort((a, b) => { const x = a[sortKey] ?? '', y = b[sortKey] ?? ''; const c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y)); return sortAsc ? c : -c; });
}

function render() {
    const rows = filtered();
    const served = rows.reduce((s, l) => s + l.peopleServed, 0);
    const byTown = {}; rows.forEach(l => byTown[l.town] = (byTown[l.town] || 0) + l.peopleServed);
    const top = Object.entries(byTown).sort((a, b) => b[1] - a[1])[0];
    $('#kCount').textContent = rows.length; $('#kServed').textContent = served.toLocaleString('en-GB');
    $('#kAvg').textContent = rows.length ? Math.round(served / rows.length) : 0; $('#kTop').textContent = top ? `${top[0]} · ${top[1].toLocaleString('en-GB')}` : '—';
    $('#sumText').textContent = `${rows.length} of ${all.length} entries`;
    $('#empty').classList.toggle('hidden', rows.length > 0);
    $('#tbody').innerHTML = rows.map(l => `<tr><td class="nw">${Shell.escape(Shell.fmtDate(l.date))}</td><td class="nw">${Shell.escape(l.day || '')}</td><td class="nw"><b>${Shell.escape(l.eventName)}</b></td><td class="nw">${Shell.escape(l.town || '')}</td><td class="num">${l.peopleServed}</td><td class="nw">${Shell.escape(l.outreachName || '')}</td><td class="small muted">${Shell.escape(l.notes || '')}</td></tr>`).join('');
    $('#cards').innerHTML = rows.map(l => `<div class="row-card" style="cursor:default"><div class="n">${l.peopleServed}</div><div style="flex:1;min-width:0"><b>${Shell.escape(l.eventName)}</b><small>${Shell.escape(Shell.fmtDate(l.date))} · ${Shell.escape(l.day || '')} · ${Shell.escape(l.town || '')}<br>${Shell.escape(l.outreachName || '')}${l.notes ? ' · ' + Shell.escape(l.notes) : ''}</small></div></div>`).join('');
    document.querySelectorAll('th.sort').forEach(th => { th.classList.toggle('on', th.dataset.k === sortKey); th.classList.toggle('asc', th.dataset.k === sortKey && sortAsc); });
}

document.querySelectorAll('th.sort').forEach(th => th.onclick = () => { if (sortKey === th.dataset.k) sortAsc = !sortAsc; else { sortKey = th.dataset.k; sortAsc = th.dataset.k !== 'date' && th.dataset.k !== 'peopleServed'; } render(); });
['q', 'town', 'from', 'to'].forEach(id => $('#' + id).addEventListener('input', render));
$('#clearBtn').onclick = () => { ['q', 'town', 'from', 'to'].forEach(id => $('#' + id).value = ''); render(); };
$('#csvBtn').onclick = () => {
    const rows = filtered();
    const cell = (v) => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const csv = '﻿' + ['date,day,event,location,people_served,logged_by,notes', ...rows.map(l => [l.date, l.day, l.eventName, l.town, l.peopleServed, l.outreachName, l.notes].map(cell).join(','))].join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `attendances-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
};
load();
</script>
</body>
</html>
