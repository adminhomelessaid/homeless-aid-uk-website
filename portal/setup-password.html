<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Set Up Your Password - Homeless Aid UK</title>
<meta name="theme-color" content="#1A2332">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/portal/registration.css">
<style>
  body { background: var(--navy); }
  .auth { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
  .auth .logo { width: 72px; height: 72px; border-radius: 18px; background: #fff; padding: 6px; margin-bottom: 14px; }
  .auth h1 { color: #fff; font-size: 22px; margin-bottom: 4px; }
  .auth .sub { color: #a0aec0; font-size: 14px; margin: 0 0 22px; text-align: center; }
  .auth .card { width: 100%; max-width: 420px; padding: 22px 20px; margin: 0; }
  .auth .err { background: var(--bad-bg); color: var(--bad); border: 1px solid #FEB2B2; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; display: none; }
  .rules { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .rules li::before { content: '○ '; } .rules li.ok { color: var(--ok); } .rules li.ok::before { content: '✓ '; }
  .who { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
</style>
</head>
<body>
<main class="auth">
  <img class="logo" src="/Branding/HomelessAidUKLogo.png" alt="Homeless Aid UK">
  <h1>Welcome to Homeless Aid UK</h1>
  <p class="sub">Choose a password to finish setting up your account</p>
  <form class="card" id="setupForm" novalidate>
    <div class="err" id="err" role="alert"></div>
    <div class="who hidden" id="who"><span class="avatar" id="whoAvatar"></span><div><b id="whoName"></b><br><span class="small muted" id="whoMeta"></span></div></div>
    <label class="field"><span>New password</span><input class="input" name="password" type="password" autocomplete="new-password" required></label>
    <ul class="rules" id="rules">
      <li data-rule="len">At least 6 characters</li><li data-rule="upper">An uppercase letter</li><li data-rule="lower">A lowercase letter</li><li data-rule="num">A number</li><li data-rule="sym">A symbol such as ! or #</li>
    </ul>
    <label class="field"><span>Confirm password</span><input class="input" name="confirm" type="password" autocomplete="new-password" required></label>
    <button class="btn block" type="submit" id="submitBtn" disabled><i class="fas fa-key"></i> Set password</button>
  </form>
</main>
<script src="/portal/registration-shell.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
const form = document.getElementById('setupForm');
const err = document.getElementById('err');
const btn = document.getElementById('submitBtn');
const showErr = (m) => { err.textContent = m; err.style.display = 'block'; };
if (!token) { showErr('This link is missing its token. Ask an admin to send a new invitation.'); }
else {
    fetch('/api/auth/verify-invitation', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) })
        .then(r => r.json()).then(d => {
            if (!d.success) throw new Error(d.message || 'This invitation is not valid');
            document.getElementById('who').classList.remove('hidden');
            document.getElementById('whoAvatar').textContent = Shell.initials(d.user.full_name);
            document.getElementById('whoName').textContent = d.user.full_name;
            document.getElementById('whoMeta').textContent = `${d.user.username} · ${Shell.roleLabel(d.user.role)}`;
        }).catch(e => { showErr(e.message); form.password.disabled = true; form.confirm.disabled = true; });
}
const checks = { len: p => p.length >= 6, upper: p => /[A-Z]/.test(p), lower: p => /[a-z]/.test(p), num: p => /[0-9]/.test(p), sym: p => /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(p) };
function validate() {
    const p = form.password.value; let all = true;
    for (const [k, fn] of Object.entries(checks)) { const ok = fn(p); all = all && ok; document.querySelector(`[data-rule="${k}"]`).classList.toggle('ok', ok); }
    btn.disabled = !(all && p === form.confirm.value && token);
}
form.password.addEventListener('input', validate); form.confirm.addEventListener('input', validate);
form.addEventListener('submit', async (e) => {
    e.preventDefault(); err.style.display = 'none'; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
        const res = await fetch('/api/auth/setup-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password: form.password.value }) });
        const d = await res.json().catch(() => ({}));
        if (!res.ok || !d.success) throw new Error(d.message || 'Could not set the password');
        if (d.token && d.user) { Shell.storeSession(d.token, d.user); location.replace(Shell.landing(d.user)); }
        else { Shell.toast('Password set. Please sign in.'); setTimeout(() => location.replace('/portal/login.html'), 1200); }
    } catch (ex) { showErr(ex.message); btn.disabled = false; btn.innerHTML = '<i class="fas fa-key"></i> Set password'; }
});
</script>
</body>
</html>
