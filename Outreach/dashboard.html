<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log Attendance - Homeless Aid UK</title>
<link rel="manifest" href="/Outreach/manifest.json">
<meta name="theme-color" content="#1A2332">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/Outreach/registration.css">
<style>
  .grid2 { display: grid; gap: 12px; }
  @media (min-width: 900px) { .grid2 { grid-template-columns: 1.1fr 0.9fr; align-items: start; } }
  .num { font-size: 32px; font-weight: 800; text-align: center; letter-spacing: -0.02em; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid #CBD5E0; background: #fff; font-size: 20px; font-weight: 700; cursor: pointer; }
  .stepper .input { text-align: center; font-size: 22px; font-weight: 700; }
  .log { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #EDF2F7; }
  .log:last-child { border-bottom: 0; }
  .log .n { font-weight: 800; font-size: 18px; min-width: 44px; text-align: right; }
  .log b { display: block; } .log small { color: var(--muted); }
  .today-list .log { padding: 8px 0; }
</style>
</head>
<body>
<div class="app">
  <div id="shellNav"></div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header class="topbar"><h1>Log attendance</h1><p>Record how many people you served at a session</p></header>
    <main class="main">
      <div id="banner"></div>
      <div id="share"></div>
      <div class="kpis" id="kpis">
        <div class="kpi"><div class="l">Served today</div><div class="v" id="kToday">–</div></div>
        <div class="kpi"><div class="l">This week</div><div class="v" id="kWeek">–</div></div>
        <div class="kpi"><div class="l">This month</div><div class="v" id="kMonth">–</div></div>
        <div class="kpi"><div class="l">Top location this month</div><div class="v" id="kTop" style="font-size:16px;padding-top:6px">–</div></div>
      </div>
      <div class="grid2">
        <form class="card" id="logForm" novalidate>
          <h2>New entry</h2>
          <label class="field"><span>Session</span><select class="select" name="event" required><option value="">Choose a session…</option></select></label>
          <label class="field"><span>Date</span><input class="input" type="date" name="date" required></label>
          <div class="field"><span>People served</span>
            <div class="stepper"><button type="button" data-step="-1" aria-label="Minus one">−</button><input class="input" type="number" name="peopleServed" inputmode="numeric" min="0" max="9999" required placeholder="0"><button type="button" data-step="1" aria-label="Plus one">+</button></div>
          </div>
          <label class="field"><span>Notes <span class="muted" style="font-weight:400">(optional)</span></span><textarea class="input" name="notes" rows="3" maxlength="500" placeholder="Anything worth noting about the session"></textarea></label>
          <button class="btn block" type="submit" id="saveBtn"><i class="fas fa-check"></i> Save entry</button>
        </form>
        <div>
          <div class="card today-list"><h3>Logged today</h3><div id="todayList"><p class="muted small">Nothing logged yet today.</p></div></div>
          <div class="card"><h3>Recent entries</h3><div id="recent"><p class="muted small">Loading…</p></div><a class="btn ghost block sm" href="/Outreach/events-overview.html" style="margin-top:10px">See all attendances</a></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/Outreach/registration-shell.js"></script>
<script>
const me = Shell.requireAuth();
Shell.renderNav({ active: 'log', user: me });
const $ = (s) => document.querySelector(s);
const form = $('#logForm');
let events = [];

function todayIso() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
form.date.value = todayIso(); form.date.max = todayIso();

async function loadEvents() {
    const text = await (await fetch('/AttendanceEvents.csv?v=' + Date.now())).text();
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    events = lines.slice(1).map(l => { const [type, name, town] = l.split(','); return { type: type.trim(), name: name.trim(), town: town.trim() }; });
    const groups = {};
    for (const e of events) (groups[e.type] = groups[e.type] || []).push(e);
    form.event.innerHTML = '<option value="">Choose a session…</option>' + Object.entries(groups).map(([type, list]) => `<optgroup label="${Shell.escape(type)}">${list.map((e, i) => `<option value="${Shell.escape(e.name)}|${Shell.escape(e.town)}">${Shell.escape(e.name === e.town ? `${e.town} ${type}` : `${e.name} (${e.town})`)}</option>`).join('')}</optgroup>`).join('');
    const last = localStorage.getItem('lastEvent'); if (last && [...form.event.options].some(o => o.value === last)) form.event.value = last;
}

async function loadStats() {
    try {
        const s = await Shell.call('/api/attendance/index?action=stats');
        $('#kToday').textContent = s.today ?? 0; $('#kWeek').textContent = s.week ?? 0; $('#kMonth').textContent = s.month ?? 0;
        const top = (s.topLocations || [])[0];
        $('#kTop').textContent = top ? `${top.location || top.name || top.town} · ${top.total ?? top.count ?? ''}` : '—';
    } catch (e) { console.warn('stats', e); }
}

function logRow(l) {
    return `<div class="log"><div class="n">${Number(l.peopleServed) || 0}</div><div style="flex:1;min-width:0"><b>${Shell.escape(l.eventName)}</b><small>${Shell.escape(Shell.fmtDate(l.date))} · ${Shell.escape(l.town || '')} · ${Shell.escape(l.outreachName || '')}${l.notes ? ' · ' + Shell.escape(l.notes) : ''}</small></div></div>`;
}

async function loadRecent() {
    try {
        const r = await Shell.call('/api/attendance/index?limit=8');
        const logs = r.logs || [];
        $('#recent').innerHTML = logs.length ? logs.map(logRow).join('') : '<p class="muted small">No entries yet.</p>';
        const today = logs.filter(l => l.date === todayIso());
        $('#todayList').innerHTML = today.length ? today.map(logRow).join('') : '<p class="muted small">Nothing logged yet today.</p>';
    } catch (e) { $('#recent').innerHTML = `<p class="muted small">${Shell.escape(e.message)}</p>`; }
}

document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { const i = form.peopleServed; i.value = Math.max(0, (Number(i.value) || 0) + Number(b.dataset.step)); });

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.event.value) return Shell.toast('Choose a session', 'error');
    if (form.peopleServed.value === '' || Number(form.peopleServed.value) < 0) return Shell.toast('Enter how many people were served', 'error');
    const [eventName, eventTown] = form.event.value.split('|');
    const btn = $('#saveBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
        await Shell.call('/api/attendance/index', { method: 'POST', body: { date: form.date.value, eventName, eventTown, peopleServed: Number(form.peopleServed.value), notes: form.notes.value.trim() } });
        localStorage.setItem('lastEvent', form.event.value);
        Shell.toast('Saved. Thank you!');
        const label = form.event.options[form.event.selectedIndex].text;
        const served = Number(form.peopleServed.value);
        const msg = `Homeless Aid UK attendance update\n${label}\n${Shell.fmtDate(form.date.value)}\nPeople served: ${served}${form.notes.value.trim() ? '\nNotes: ' + form.notes.value.trim() : ''}\nLogged by ${me.name}`;
        $('#share').innerHTML = `<div class="card" style="background:var(--ok-bg);border-color:#9AE6B4;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1"><b>Saved.</b> <span class="small">${Shell.escape(label)} · ${served} served</span></div><a class="btn sm" style="background:#25D366" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}"><i class="fab fa-whatsapp"></i> Share on WhatsApp</a></div>`;
        form.peopleServed.value = ''; form.notes.value = '';
        loadStats(); loadRecent();
    } catch (ex) { Shell.toast(ex.message, 'error'); }
    finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Save entry'; }
});

(async () => {
    try { const m = await Shell.api('me'); if (!m.state.registration_complete) $('#banner').innerHTML = `<div class="banner"><i class="fas fa-triangle-exclamation"></i><div style="flex:1"><b>Your registration is incomplete.</b></div><a class="btn sm" href="/Outreach/registration">Complete now</a></div>`; } catch {}
})();
loadEvents().catch(e => Shell.toast('Could not load the session list', 'error'));
loadStats(); loadRecent();
</script>
</body>
</html>
